name: Continuous Payload

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuous-payload
  cancel-in-progress: true

jobs:
  build:
    name: Build latest payload (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
    - name: 检出仓库
      uses: actions/checkout@v6

    - name: 编译 C++ 代理和部署配置
      shell: pwsh
      run: .\build.ps1 -Clean -Config Release -Arch ${{ matrix.arch }} -SkipTests

    - name: 打包安装器所需部署源
      shell: pwsh
      env:
        TARGET_ARCH: ${{ matrix.arch }}
      run: |
        $ErrorActionPreference = "Stop"
        $payloadDir = Join-Path $env:RUNNER_TEMP "payload"
        $assetDir = Join-Path $env:RUNNER_TEMP "assets"
        New-Item -ItemType Directory -Path $payloadDir,$assetDir -Force | Out-Null

        Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "output\ide\version.dll") -Destination $payloadDir -Force
        Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "output\ide\config.json") -Destination $payloadDir -Force

        $assetPath = Join-Path $assetDir "antigravity-proxy-latest-ide-win-$($env:TARGET_ARCH).zip"
        Compress-Archive -Path (Join-Path $payloadDir "*") -DestinationPath $assetPath -Force

    - name: 上传临时构建产物
      uses: actions/upload-artifact@v7
      with:
        name: continuous-payload-${{ matrix.arch }}
        path: ${{ runner.temp }}/assets/*.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  publish:
    name: Publish latest payload
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
    - name: 下载临时构建产物
      uses: actions/download-artifact@v8
      with:
        pattern: continuous-payload-*
        path: assets
        merge-multiple: true

    - name: 更新 latest Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
      shell: bash
      run: |
        set -euo pipefail

        if gh release view latest --repo "$GH_REPO" >/dev/null 2>&1; then
          gh release edit latest \
            --repo "$GH_REPO" \
            --title "Continuous build (latest)" \
            --notes "由 main 分支最近一次成功构建生成。Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
        else
          gh release create latest \
            --repo "$GH_REPO" \
            --title "Continuous build (latest)" \
            --notes "由 main 分支最近一次成功构建生成。Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
        fi

        gh release upload latest assets/*.zip --repo "$GH_REPO" --clobber
